<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · UNRㅌㅌL</title>
  <link rel="icon" href="/logo.svg">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/account.css">
</head>
<body class="auth-page">
  <main class="card">
    <a class="brand" href="/"><img src="/logo.svg" alt="">UNRㅌㅌL</a>
    <form id="register">
      <h1>Register</h1>
      <label>Name
        <input name="name" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_.\-]+"
          title="letters, digits, _ . or -">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
      </label>
      <label>Description
        <textarea name="description" maxlength="480"></textarea>
      </label>
      <label>Profile picture
        <span class="pfp-row">
          <span class="pfp-preview"></span>
          <input name="pfp" type="file" accept="image/*">
        </span>
      </label>
      <p class="error" role="alert"></p>
      <button type="submit">Register</button>
      <p class="alt">Already registered? <a href="/login">Log in</a></p>
    </form>

    <form id="registered" hidden>
      <h1>Registered</h1>
      <p class="alt">This is your reset token. You need it to change your password, and it isn't shown again.</p>
      <pre class="token"></pre>
      <button type="submit">Continue</button>
    </form>
  </main>

  <script src="/account.js"></script>
  <script>
    // the same size as the seeded pictures
    const PFP_SIZE = 176;

    // A square crop of the middle of the image, as base64 JPEG
    async function pfpBase64(file) {
      let bitmap;
      try {
        bitmap = await createImageBitmap(file);
      } catch {
        throw new Error('That profile picture is not an image.');
      }
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = PFP_SIZE;
      const side = Math.min(bitmap.width, bitmap.height);
      canvas.getContext('2d').drawImage(bitmap,
        (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side, 0, 0, PFP_SIZE, PFP_SIZE);
      return canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
    }

    const form = document.getElementById('register');
    const preview = form.querySelector('.pfp-preview');
    form.pfp.addEventListener('change', () => {
      const file = form.pfp.files[0];
      preview.style.backgroundImage = file ? `url(${URL.createObjectURL(file)})` : '';
    });

    account.bindForm(form, async ({ name, password, description, pfp }) => {
      const fields = { name, password, description };
      if (pfp.size > 0) fields.pfp = await pfpBase64(pfp);
      const { reset_token } = await account.post('/api/register', fields);
      await account.login(name, password);
      form.hidden = true;
      registered.querySelector('.token').textContent = reset_token;
      registered.hidden = false;
    });

    const registered = document.getElementById('registered');
    registered.addEventListener('submit', (e) => {
      e.preventDefault();
      location.href = '/';
    });
  </script>
</body>
</html>
