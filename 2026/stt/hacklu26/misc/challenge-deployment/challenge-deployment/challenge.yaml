apiVersion: v1
kind: Namespace
metadata:
  name: ctf
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: challenges.fluxfingers.ctf
spec:
  group: fluxfingers.ctf
  scope: Namespaced
  names:
    plural: challenges
    singular: challenge
    kind: Challenge
    shortNames:
      - chal
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - title
                - description
              properties:
                id:
                  type: string
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                  enum:
                    - web
                    - misc
                    - crypto
                    - pwn
                    - rev
                details:
                  type: string
                stage:
                  type: string
                  enum:
                    - Planned
                    - Created
                    - Deployed
                flagRef:
                  type: string
      additionalPrinterColumns:
        - name: Title
          type: string
          jsonPath: .spec.title
        - name: Category
          type: string
          jsonPath: .spec.category
        - name: Stage
          type: string
          jsonPath: .spec.stage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: challenge-controller
  namespace: ctf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: challenge-controller
  namespace: ctf
rules:
  - apiGroups:
      - fluxfingers.ctf
    resources:
      - challenges
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: challenge-controller
  namespace: ctf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: challenge-controller
subjects:
  - kind: ServiceAccount
    name: challenge-controller
    namespace: ctf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: ctf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: challenge-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: container
          image: p4ck3t0/tickets:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - controller.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: ctf
spec:
  type: ClusterIP
  selector:
    app: controller
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ctf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: container
          image: p4ck3t0/tickets:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - api.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: CONTROLLER_URL
              value: http://controller
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ctf
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
