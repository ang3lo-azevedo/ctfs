apiVersion: v1
kind: ConfigMap
metadata:
  name: web-templates-content
  namespace: ctf
data:
  template.yaml: |
    apiVersion: fluxfingers.ctf/v1
    kind: Challenge
    spec:
      title: "{{title}}"
      description: "{{description}}"
      category: "web"
      details: "{{Challenge Website}}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-templates
  namespace: ctf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-templates
  template:
    metadata:
      labels:
        app: web-templates
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: container
          image: nginxinc/nginx-unprivileged:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: content
          configMap:
            name: web-templates-content
---
apiVersion: v1
kind: Service
metadata:
  name: web-templates
  namespace: ctf
spec:
  type: ClusterIP
  selector:
    app: web-templates
  ports:
    - name: http
      port: 80
      targetPort: http
