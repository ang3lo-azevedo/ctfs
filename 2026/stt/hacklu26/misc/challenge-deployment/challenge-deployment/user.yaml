apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctf-player
  namespace: ctf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-player
  namespace: ctf
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
    resourceNames: ["ui"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-player
  namespace: ctf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ctf-player
subjects:
  - kind: ServiceAccount
    name: ctf-player
    namespace: ctf
